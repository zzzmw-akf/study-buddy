<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>考研能量站 · 学习模式</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #0a0a1a;
  color: #e0e0e0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
/* ---- Header ---- */
.header {
  background: linear-gradient(135deg, #1a1a3e 0%, #2d1b69 100%);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #333;
}
.room-code {
  font-size: 13px;
  color: #aaa;
}
.room-code span {
  color: #7c4dff;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 2px;
}
.conn-status {
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 20px;
  background: #333;
  color: #aaa;
}
.conn-status.online  { background: #1b5e20; color: #69f0ae; }
.conn-status.waiting { background: #e65100; color: #ffcc80; }

/* ---- Timer ---- */
.timer-section {
  text-align: center;
  padding: 30px 20px 20px;
}
.timer-ring {
  width: 200px;
  height: 200px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: conic-gradient(#7c4dff 0%, #333 0%);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: background 0.5s;
}
.timer-ring.running {
  background: conic-gradient(#69f0ae 0%, #1b5e20 0%, #333 0%);
}
.timer-inside {
  width: 170px;
  height: 170px;
  border-radius: 50%;
  background: #0a0a1a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#timerDisplay {
  font-size: 36px;
  font-weight: 700;
  color: #fff;
  font-variant-numeric: tabular-nums;
}
#timerLabel {
  font-size: 12px;
  color: #888;
  margin-top: 4px;
}
.timer-btns {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 16px;
}
.timer-btns button {
  padding: 10px 24px;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
#btnStart {
  background: #7c4dff;
  color: #fff;
}
#btnStart:hover { background: #651fff; }
#btnPause {
  background: #ff9100;
  color: #fff;
}
#btnReset {
  background: #333;
  color: #ccc;
}

/* ---- Goals ---- */
.goals-section {
  padding: 0 20px 20px;
}
.goals-section h3 {
  font-size: 14px;
  color: #aaa;
  margin-bottom: 10px;
}
.goal-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
#goalInput {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid #333;
  border-radius: 8px;
  background: #1a1a2e;
  color: #e0e0e0;
  font-size: 15px;
}
#goalInput::placeholder { color: #666; }
#addGoalBtn {
  padding: 10px 16px;
  background: #7c4dff;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}
.goal-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: #1a1a2e;
  border-radius: 8px;
  margin-bottom: 6px;
  transition: all 0.3s;
}
.goal-item.done {
  opacity: 0.5;
  text-decoration: line-through;
}
.goal-item input[type="checkbox"] {
  width: 20px;
  height: 20px;
  accent-color: #7c4dff;
}
.goal-item .text {
  flex: 1;
  font-size: 15px;
}
.goal-item .del-btn {
  background: none;
  border: none;
  color: #666;
  font-size: 18px;
  cursor: pointer;
  padding: 0 4px;
}
.goal-item .del-btn:hover { color: #ff5252; }

/* ---- SOS ---- */
.sos-section {
  padding: 20px;
  text-align: center;
}
#sosBtn {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 3px solid #ff1744;
  background: rgba(255,23,68,0.1);
  color: #ff5252;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
#sosBtn:active {
  background: #ff1744;
  color: #fff;
  transform: scale(0.95);
}

/* ---- Encourage popup ---- */
.encourage-popup {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.encourage-popup.show { display: flex; }
.encourage-box {
  background: #1a1a3e;
  border: 2px solid #7c4dff;
  border-radius: 16px;
  padding: 30px;
  text-align: center;
  max-width: 300px;
  width: 90%;
  animation: popIn 0.3s ease;
}
@keyframes popIn {
  from { transform: scale(0.8); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
.encourage-box .icon { font-size: 48px; margin-bottom: 12px; }
.encourage-box .msg {
  font-size: 18px;
  line-height: 1.6;
  color: #fff;
  margin-bottom: 20px;
}
.encourage-box button {
  padding: 8px 24px;
  background: #7c4dff;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
}

/* ---- Help bar ---- */
.help-bar {
  padding: 10px 20px;
  text-align: center;
  font-size: 13px;
  color: #ff9100;
  display: none;
}
.help-bar.show { display: block; }
.help-bar a {
  color: #ff9100;
  text-decoration: underline;
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="room-code">房间号：<span id="roomCode">----</span></div>
  <div class="conn-status waiting" id="connStatus">正在连接…</div>
</div>
<div style="text-align:center; padding:6px; font-size:12px; color:#aaa;" id="connText">正在连接 Supabase…</div>

<!-- Timer -->
<div class="timer-section">
  <div class="timer-ring" id="timerRing">
    <div class="timer-inside">
      <div id="timerDisplay">00:00</div>
      <div id="timerLabel">未开始</div>
    </div>
  </div>
  <div class="timer-btns">
    <button id="btnStart">▶ 开始</button>
    <button id="btnPause">⏸ 暂停</button>
    <button id="btnReset">↺ 重置</button>
  </div>
</div>

<!-- Goals -->
<div class="goals-section">
  <h3>📋 今日目标</h3>
  <div class="goal-input-row">
    <input type="text" id="goalInput" placeholder="输入一个学习目标…">
    <button id="addGoalBtn">+</button>
  </div>
  <div id="goalsList"></div>
</div>

<!-- SOS -->
<div class="sos-section">
  <button id="sosBtn">🆘<br><small>求助</small></button>
  <div style="font-size:12px; color:#666; margin-top:8px;">已发送 <span id="sosCount">0</span> 次求助</div>
</div>

<!-- Encourage popup -->
<div class="encourage-popup" id="encouragePopup">
  <div class="encourage-box">
    <div class="icon">💪</div>
    <div class="msg" id="encourageMsg"></div>
    <button onclick="document.getElementById('encouragePopup').classList.remove('show')">收到！</button>
  </div>
</div>

<!-- Help bar -->
<div class="help-bar" id="helpBar">
  <span id="helpText"></span>
  <a href="#" id="retryLink">重新连接</a>
</div>

<script src="config.js"></script>
<script>
// ========== Pure REST API helpers (no SDK needed) ==========
var API_URL = SUPABASE_URL + '/rest/v1/';
var HEADERS = {
  'Accept': 'application/json',
  'Content-Type': 'application/json',
  'apikey': SUPABASE_ANON_KEY,
  'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
  'Prefer': 'return=representation'
};

function api(path, method, body) {
  var url = API_URL + path;
  var opts = {
    method: method,
    headers: HEADERS
  };
  if (body) opts.body = JSON.stringify(body);
  return fetch(url, opts).then(function(r) {
    if (!r.ok) {
      return r.text().then(function(text) {
        var hint = '';
        if (r.status === 401) hint = ' (API key 无效)';
        if (r.status === 403) hint = ' (权限不足：请在 Supabase SQL Editor 执行 GRANT SELECT, INSERT ON public.messages TO anon;)';
        if (text && text.indexOf('permission denied') !== -1) hint = ' (权限不足：请给 anon 角色授权)';
        throw new Error('HTTP ' + r.status + hint + (text ? ': ' + text.substring(0, 120) : ''));
      });
    }
    if (r.status === 204) return {};
    return r.json();
  });
}

function listen(path, callback) {
  // Supabase Realtime via REST long-poll (simple version: short poll)
  var url = API_URL + path + '&apikey=' + encodeURIComponent(SUPABASE_ANON_KEY);
  return fetch(url, { headers: HEADERS }).then(function(r) { return r.json(); }).then(callback);
}

// ========== State ==========
var myId = '';
var myRole = 'student';
var connected = false;
var goals = [];
var sosCount = 0;
var timerState = {
  status: 'stopped',  // stopped | running | paused
  accumulatedMs: 0,
  sessionStart: null,
  lastPauseMs: 0
};
var timerInterval = null;
var lastSyncMs = 0;

// ========== Init ==========
function initAndConnect() {
  if (!SUPABASE_URL || SUPABASE_URL === 'YOUR_SUPABASE_URL') {
    document.getElementById('connText').textContent = '⚠️ 请先在 config.js 填入 Supabase 配置';
    setStatus('offline');
    return;
  }

  var params = new URLSearchParams(location.search);
  var roomParam = params.get('room');
  myId = roomParam ? roomParam.toUpperCase() : localStorage.getItem('sb_peer_id') || (function() {
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    var id = '';
    for (var i = 0; i < 6; i++) id += chars[Math.floor(Math.random() * chars.length)];
    localStorage.setItem('sb_peer_id', id);
    return id;
  })();
  document.getElementById('roomCode').textContent = myId;

  connectSupabase();
}

function connectSupabase() {
  setStatus('connecting');
  document.getElementById('connText').textContent = '正在连接 Supabase…';
  document.getElementById('helpBar').style.display = 'none';

  // Test connection by inserting a dummy read
  api('messages?select=id&room=eq.' + encodeURIComponent(myId) + '&limit=1', 'GET')
    .then(function() {
      connected = true;
      console.log('Supabase: connected, room', myId);
      setStatus('waiting');
      document.getElementById('connText').textContent = '已连接 · 等待监督者加入';
      document.getElementById('helpBar').style.display = 'none';

      startPolling();
      sendStatus();
      sendHistory();
    })
    .catch(function(err) {
      console.error('Supabase error:', err);
      connected = false;
      setStatus('offline');
      var msg = err.message || '';
      if (msg.indexOf('403') !== -1 || msg.indexOf('permission denied') !== -1 || msg.indexOf('权限') !== -1) {
        document.getElementById('connText').textContent = '❌ 数据库权限不足';
        document.getElementById('helpBar').innerHTML = '请去 Supabase → SQL Editor 执行：<br><code style="background:#222;color:#fff;padding:2px 6px;border-radius:4px;">GRANT SELECT, INSERT ON public.messages TO anon;</code>';
      } else if (msg.indexOf('404') !== -1) {
        document.getElementById('connText').textContent = '❌ messages 表不存在';
      } else {
        document.getElementById('connText').textContent = '连接失败，3秒后重试…';
      }
      document.getElementById('helpBar').style.display = '';
      setTimeout(connectSupabase, 3000);
    });
}

// ========== Polling for new messages ==========
var pollTimer = null;
var lastMessageId = 0;

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(function() {
    if (!connected) return;
    api('messages?select=*&room=eq.' + encodeURIComponent(myId) + '&sender=neq.student&id=gt.' + lastMessageId + '&order=id.asc', 'GET')
      .then(function(msgs) {
        msgs.forEach(function(msg) {
          if (msg.id > lastMessageId) lastMessageId = msg.id;
          handleIncoming(msg);
        });
      })
      .catch(function(err) { console.error('Poll error:', err); });
  }, 2000);  // poll every 2 seconds
}

// ========== Send ==========
function send(msg) {
  if (!connected) return;
  api('messages', 'POST', {
    room: myId,
    type: msg.type,
    data: msg.data || msg,
    sender: myRole,
    timestamp: Date.now()
  }).catch(function(err) {
    console.error('Send error:', err);
  });
}

// ========== Handle incoming ==========
function handleIncoming(msg) {
  switch (msg.type) {
    case 'encourage':
      showEncourage(msg.data && msg.data.message || msg.message || '加油！');
      break;
    case 'supervisor-online':
      setStatus('online');
      document.getElementById('connText').textContent = '✅ 监督者已在线';
      document.getElementById('helpBar').style.display = 'none';
      sendStatus();
      sendHistory();
      break;
  }
}

// ========== UI helpers ==========
function setStatus(state) {
  var el = document.getElementById('connStatus');
  if (state === 'online') {
    el.className = 'conn-status online';
  } else if (state === 'connecting') {
    el.className = 'conn-status waiting';
  } else {
    el.className = 'conn-status';
  }
}

function showEncourage(message) {
  document.getElementById('encourageMsg').textContent = message;
  document.getElementById('encouragePopup').classList.add('show');
}

// ========== Timer ==========
function updateTimer() {
  var ms = getCurrentMs();
  var totalSec = Math.floor(ms / 1000);
  var hrs = Math.floor(totalSec / 3600);
  var mins = Math.floor((totalSec % 3600) / 60);
  var secs = totalSec % 60;
  var display = '';
  if (hrs > 0) display += hrs + ':';
  display += String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
  document.getElementById('timerDisplay').textContent = display;

  var label = '';
  if (timerState.status === 'running') label = '学习中…';
  else if (timerState.status === 'paused') label = '已暂停';
  else label = '未开始';
  document.getElementById('timerLabel').textContent = label;

  var ring = document.getElementById('timerRing');
  if (timerState.status === 'running') {
    ring.classList.add('running');
  } else {
    ring.classList.remove('running');
  }
}

function getCurrentMs() {
  if (timerState.status === 'running') {
    return timerState.accumulatedMs + (Date.now() - timerState.sessionStart);
  } else if (timerState.status === 'paused') {
    return timerState.accumulatedMs + timerState.lastPauseMs;
  } else {
    return timerState.accumulatedMs;
  }
}

document.getElementById('btnStart').addEventListener('click', function() {
  if (timerState.status === 'running') return;
  if (timerState.status === 'paused') {
    // Resume
    timerState.status = 'running';
    timerState.sessionStart = Date.now();
  } else {
    timerState.status = 'running';
    timerState.sessionStart = Date.now();
  }
  if (!timerInterval) {
    timerInterval = setInterval(updateTimer, 1000);
  }
  updateTimer();
  sendStatus();
});

document.getElementById('btnPause').addEventListener('click', function() {
  if (timerState.status !== 'running') return;
  timerState.status = 'paused';
  timerState.lastPauseMs = Date.now() - timerState.sessionStart;
  updateTimer();
  sendStatus();
});

document.getElementById('btnReset').addEventListener('click', function() {
  timerState.status = 'stopped';
  timerState.accumulatedMs = 0;
  timerState.sessionStart = null;
  timerState.lastPauseMs = 0;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  updateTimer();
  sendStatus();
});

// ========== Goals ==========
function renderGoals() {
  var list = document.getElementById('goalsList');
  list.innerHTML = '';
  goals.forEach(function(g, i) {
    var div = document.createElement('div');
    div.className = 'goal-item' + (g.done ? ' done' : '');
    div.innerHTML = '<input type="checkbox" ' + (g.done ? 'checked' : '') + ' data-i="' + i + '">' +
      '<span class="text">' + escapeHtml(g.text) + '</span>' +
      '<button class="del-btn" data-i="' + i + '">×</button>';
    list.appendChild(div);
  });
  // Bind events
  list.querySelectorAll('input[type="checkbox"]').forEach(function(cb) {
    cb.addEventListener('change', function() {
      var i = parseInt(this.getAttribute('data-i'));
      goals[i].done = this.checked;
      renderGoals();
      sendStatus();
    });
  });
  list.querySelectorAll('.del-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var i = parseInt(this.getAttribute('data-i'));
      goals.splice(i, 1);
      renderGoals();
      sendStatus();
    });
  });
}

document.getElementById('addGoalBtn').addEventListener('click', function() {
  var input = document.getElementById('goalInput');
  var text = input.value.trim();
  if (!text) return;
  goals.push({ text: text, done: false });
  input.value = '';
  renderGoals();
  sendStatus();
});

document.getElementById('goalInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('addGoalBtn').click();
});

// ========== SOS ==========
document.getElementById('sosBtn').addEventListener('click', function() {
  sosCount++;
  document.getElementById('sosCount').textContent = sosCount;
  send({ type: 'sos', message: '学生求助！' });
});

// ========== Status sync ==========
function sendStatus() {
  var ms = getCurrentMs();
  send({
    type: 'status',
    data: {
      goals: goals.map(function(g) { return { text: g.text, done: g.done }; }),
      completed: goals.filter(function(g) { return g.done; }).length,
      total: goals.length,
      sosCount: sosCount,
      timer: {
        status: timerState.status,
        currentMs: ms,
        accumulatedMs: timerState.accumulatedMs,
        sessionStart: timerState.sessionStart
      }
    }
  });
}

function sendHistory() {
  send({
    type: 'history',
    data: { goals: goals, sosCount: sosCount, timer: timerState }
  });
}

// Periodic status sync — every 10s
setInterval(function() {
  if (connected) sendStatus();
}, 10000);

// ========== Utility ==========
function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ========== Retry ==========
document.getElementById('retryLink').addEventListener('click', function(e) {
  e.preventDefault();
  connectSupabase();
});

// ========== Init ==========
initAndConnect();
updateTimer();
</script>
</body>
</html>
