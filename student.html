<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>考研能量站 · 学习模式</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(180deg, #fff8f0 0%, #fff0e8 40%, #ffe8d6 100%);
  min-height:100vh; color:#4a3728;
  -webkit-tap-highlight-color:transparent;
}
.page { max-width:480px; margin:0 auto; padding:20px 16px 60px; }

/* Header */
.header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.logo { font-size:22px; font-weight:800; color:#d4724a; display:flex; align-items:center; gap:8px; }
.conn-status { display:flex; align-items:center; gap:5px; font-size:12px; padding:5px 12px; border-radius:20px; font-weight:600; }
.conn-status.online { background:#e8f5e9; color:#2e7d32; }
.conn-status.offline { background:#fce4ec; color:#c62828; }
.conn-dot { width:8px; height:8px; border-radius:50%; }
.conn-status.connecting { background:#fff3e0; color:#e65100; }
.conn-status.connecting .conn-dot { background:#ff9800; animation:dotPulse 0.8s infinite; }
@keyframes dotPulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

/* Room */
.room-card { background:rgba(255,255,255,0.75); border-radius:14px; padding:14px 16px; margin-bottom:18px; backdrop-filter:blur(10px); border:1px solid rgba(212,114,74,0.12); }
.room-label { font-size:11px; color:#b08060; margin-bottom:6px; }
.room-code { font-size:28px; font-weight:800; letter-spacing:4px; color:#d4724a; cursor:pointer; display:inline-block; }
.room-code:active { opacity:0.6; }
.room-copy { font-size:12px; color:#d4724a; margin-top:4px; opacity:0.7; }

/* Help bar */
.help-bar { background:rgba(255,235,210,0.8); border-radius:10px; padding:10px 14px; margin-bottom:16px; font-size:13px; color:#8a5a3a; border:1px solid rgba(212,114,74,0.15); }
.help-bar a { color:#d4724a; cursor:pointer; text-decoration:underline; }

/* Error bar */
.error-bar { background:rgba(255,220,220,0.9); border-radius:10px; padding:10px 14px; margin-bottom:16px; font-size:13px; color:#c62828; border:1px solid rgba(198,40,40,0.3); display:none; }
.error-bar.show { display:block; }

/* Goals */
.goals-card { background:rgba(255,255,255,0.75); border-radius:14px; padding:16px; margin-bottom:18px; backdrop-filter:blur(10px); border:1px solid rgba(212,114,74,0.10); }
.goals-title { font-size:14px; font-weight:700; color:#6a5040; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
.goal-input-row { display:flex; gap:8px; margin-bottom:12px; }
.goal-input { flex:1; border:1.5px solid rgba(212,114,74,0.2); border-radius:10px; padding:10px 12px; font-size:15px; outline:none; background:rgba(255,255,255,0.8); color:#4a3728; }
.goal-input:focus { border-color:#d4724a; }
.add-btn { width:42px; height:42px; border-radius:10px; border:2px dashed rgba(212,114,74,0.3); background:transparent; font-size:20px; cursor:pointer; color:#d4724a; transition:all 0.2s; display:flex; align-items:center; justify-content:center; }
.add-btn:active { background:rgba(212,114,74,0.1); }
.goal-list { list-style:none; }
.goal-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid rgba(212,114,74,0.08); font-size:15px; }
.goal-item:last-child { border-bottom:none; }
.goal-check { width:22px; height:22px; border-radius:50%; border:2px solid rgba(212,114,74,0.3); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.2s; }
.goal-check:active { transform:scale(0.9); }
.goal-check.done { background:#d4724a; border-color:#d4724a; }
.goal-check.done::after { content:''; }
.goal-text { flex:1; }
.goal-text.done { text-decoration:line-through; opacity:0.5; }
.goal-del { width:24px; height:24px; border:none; background:transparent; color:#cc8888; font-size:16px; cursor:pointer; opacity:0; transition:opacity 0.2s; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.goal-item:hover .goal-del { opacity:1; }
.goals-empty { text-align:center; padding:20px; color:#b09080; font-size:14px; }

/* Timer */
.timer-card { background:rgba(255,255,255,0.75); border-radius:14px; padding:16px; margin-bottom:18px; backdrop-filter:blur(10px); border:1px solid rgba(212,114,74,0.10); }
.timer-display { text-align:center; font-size:42px; font-weight:800; color:#d4724a; letter-spacing:2px; margin:10px 0; font-variant-numeric:tabular-nums; }
.timer-btn-row { display:flex; gap:10px; justify-content:center; }
.timer-btn { flex:1; padding:10px; border-radius:10px; border:1.5px solid rgba(212,114,74,0.25); background:rgba(255,255,255,0.6); font-size:14px; font-weight:600; cursor:pointer; color:#d4724a; transition:all 0.15s; max-width:140px; }
.timer-btn:active { background:rgba(212,114,74,0.12); }
.timer-btn.primary { background:#d4724a; color:#fff; border-color:#d4724a; }
.timer-btn.primary:active { background:#c0623a; }

/* SOS */
.sos-card { background:rgba(255,255,255,0.75); border-radius:14px; padding:16px; margin-bottom:18px; backdrop-filter:blur(10px); border:1px solid rgba(212,114,74,0.10); text-align:center; }
.sos-btn { width:100%; padding:14px; border-radius:12px; border:none; background:linear-gradient(135deg,#ff8a65,#ff6e40); color:#fff; font-size:16px; font-weight:700; cursor:pointer; transition:all 0.2s; box-shadow:0 4px 14px rgba(255,110,64,0.3); }
.sos-btn:active { transform:scale(0.97); box-shadow:0 2px 8px rgba(255,110,64,0.3); }
.sos-count { font-size:12px; color:#b08070; margin-top:8px; }
.sos-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; z-index:100; }
.sos-overlay.show { display:flex; }
.sos-dialog { background:#fff; border-radius:20px; padding:32px 28px; max-width:320px; width:90%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.25); }
.sos-dialog h3 { font-size:20px; margin-bottom:8px; color:#d4724a; }
.sos-dialog p { font-size:14px; color:#7a6a5a; margin-bottom:20px; line-height:1.6; }
.sos-timer { font-size:32px; font-weight:800; color:#d4724a; margin:12px 0; }
.sos-cancel { padding:10px 28px; border-radius:20px; border:1.5px solid rgba(212,114,74,0.3); background:transparent; font-size:14px; color:#d4724a; cursor:pointer; font-weight:600; }

/* Records */
.records-card { background:rgba(255,255,255,0.75); border-radius:14px; padding:16px; backdrop-filter:blur(10px); border:1px solid rgba(212,114,74,0.10); }
.records-header { font-size:14px; font-weight:700; color:#6a5040; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
.records-list { font-size:13px; color:#8a7a6a; line-height:1.8; }
.records-empty { text-align:center; padding:16px; color:#b09080; font-size:13px; }
.session-item { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid rgba(212,114,74,0.06); }
.session-item:last-child { border-bottom:none; }

/* Encourage Toast */
.encourage-toast { position:fixed; top:60px; left:50%; transform:translateX(-50%); background:rgba(255,255,255,0.95); border-radius:16px; padding:14px 24px; font-size:15px; font-weight:600; color:#d4724a; box-shadow:0 8px 30px rgba(212,114,74,0.25); z-index:200; opacity:0; transition:opacity 0.3s; pointer-events:none; white-space:nowrap; }
.encourage-toast.show { opacity:1; }

/* History card */
.history-card { background:rgba(255,255,255,0.75); border-radius:14px; padding:16px; margin-bottom:18px; backdrop-filter:blur(10px); border:1px solid rgba(212,114,74,0.10); display:none; }
.history-header { font-size:14px; font-weight:700; color:#6a5040; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
.history-list { font-size:13px; color:#8a7a6a; line-height:1.8; max-height:200px; overflow-y:auto; }
.history-empty { text-align:center; padding:16px; color:#b09080; font-size:13px; }
</style>
</head>
<body>

<div class="page">
  <div class="header">
    <div class="logo">🔥 考研能量站</div>
    <div class="conn-status offline" id="connStatus">
      <div class="conn-dot"></div>
      <span id="connText">正在初始化…</span>
    </div>
  </div>

  <div class="error-bar" id="errorBar"></div>

  <div class="room-card">
    <div class="room-label">我的监督码（告诉监督者）</div>
    <div class="room-code" id="roomCode" title="点击复制">------</div>
    <div class="room-copy">点击监督码可复制</div>
  </div>

  <div class="help-bar" id="helpBar" style="display:none;">
    ⚠️ 无法连接云端。请检查网络后 <a id="retryLink">重试</a>
  </div>

  <!-- Goals -->
  <div class="goals-card">
    <div class="goals-title">🎯 今日目标</div>
    <div class="goal-input-row">
      <input class="goal-input" id="goalInput" placeholder="输入一个学习目标…" maxlength="40">
      <button class="add-btn" id="addBtn">＋</button>
    </div>
    <ul class="goal-list" id="goalList"></ul>
    <div class="goals-empty" id="goalsEmpty">还没有目标，添加一个吧 ✨</div>
  </div>

  <!-- Timer -->
  <div class="timer-card">
    <div class="goals-title">⏱️ 学习计时</div>
    <div class="timer-display" id="timerDisplay">00:00:00</div>
    <div class="timer-btn-row">
      <button class="timer-btn" id="timerToggle">开始学习</button>
      <button class="timer-btn" id="timerReset">重置</button>
    </div>
  </div>

  <!-- SOS -->
  <div class="sos-card">
    <div class="goals-title">🆘 需要鼓励</div>
    <button class="sos-btn" id="sosBtn">发送鼓励信号 💪</button>
    <div class="sos-count" id="sosCount">今日已发送 0 次</div>
  </div>

  <!-- History -->
  <div class="history-card" id="historyCard">
    <div class="history-header" id="historyHeader">📜 激励记录 <span id="historyToggle">▸</span></div>
    <div class="history-list" id="historyList"><div class="history-empty">还没有激励记录</div></div>
  </div>

  <!-- Records -->
  <div class="records-card">
    <div class="records-header" id="recordsHeader">📊 学习记录 <span id="recordsToggle">▾</span></div>
    <div class="records-list" id="recordsList"><div class="records-empty">还没有记录，开始计时吧 ⏱️</div></div>
  </div>
</div>

<!-- SOS Overlay -->
<div class="sos-overlay" id="sosOverlay">
  <div class="sos-dialog">
    <h3>💪 加油！</h3>
    <p>你已经坚持了 <strong id="sosStrong">2:00</strong><br>监督者正在赶来…</p>
    <div class="sos-timer" id="sosTimer">2:00</div>
    <button class="sos-cancel" id="sosCancel">我不想做了</button>
  </div>
</div>

<!-- Encourage Toast -->
<div class="encourage-toast" id="encourageToast"></div>

<script src="config.js"></script>
<script>
(function() {
const $ = s => document.querySelector(s);

// ---- State ----
let goals = JSON.parse(localStorage.getItem('sb_goals') || '[]');
let sosCount = parseInt(localStorage.getItem('sb_sos_today') || '0');
let lastDate = localStorage.getItem('sb_date');
const today = new Date().toDateString();

if (lastDate !== today) {
  saveDailyRecord(lastDate);
  goals = [];
  sosCount = 0;
  localStorage.setItem('sb_goals', '[]');
  localStorage.setItem('sb_sos_today', '0');
  localStorage.setItem('sb_date', today);
  localStorage.removeItem('sb_timer_state');
  localStorage.removeItem('sb_timer_sessions');
}

// ---- Timer ----
let timerState = JSON.parse(localStorage.getItem('sb_timer_state') || '{"status":"idle","accumulatedMs":0,"sessionStart":null}');
let timerSessions = JSON.parse(localStorage.getItem('sb_timer_sessions') || '[]');
let timerInterval = null;

function saveTimer() {
  localStorage.setItem('sb_timer_state', JSON.stringify(timerState));
  localStorage.setItem('sb_timer_sessions', JSON.stringify(timerSessions));
  renderRecords();
}

function renderRecords() {
  const list = $('#recordsList');
  if (!timerSessions || timerSessions.length === 0) {
    list.innerHTML = '<div class="records-empty">还没有学习记录，开始计时吧 ⏱️</div>';
    return;
  }
  list.innerHTML = timerSessions.slice(-10).reverse().map(s => {
    const start = new Date(s.start);
    const end = s.end ? new Date(s.end) : new Date();
    const ms = s.end ? (new Date(s.end) - new Date(s.start)) : timerState.accumulatedMs;
    const h = Math.floor(ms / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    const label = s.end ? start.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}) + ' - ' + end.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}) : '进行中…';
    return `<div class="session-item"><span>${label}</span><span style="font-weight:600;color:#d4724a;">${h>0?h+'h ':''}${m}m</span></div>`;
  }).join('');
}

function getCurrentMs() {
  if (timerState.status === 'running' && timerState.sessionStart) {
    return timerState.accumulatedMs + (Date.now() - timerState.sessionStart);
  }
  return timerState.accumulatedMs;
}

function formatMs(ms) {
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function updateTimerDisplay() {
  $('#timerDisplay').textContent = formatMs(getCurrentMs());
}

function toggleTimer() {
  if (timerState.status === 'idle') {
    timerState.status = 'running';
    timerState.sessionStart = Date.now();
    timerInterval = setInterval(updateTimerDisplay, 1000);
    $('#timerToggle').textContent = '暂停';
    $('#timerToggle').className = 'timer-btn primary';
  } else if (timerState.status === 'running') {
    timerState.accumulatedMs += Date.now() - timerState.sessionStart;
    timerState.sessionStart = null;
    timerState.status = 'paused';
    clearInterval(timerInterval);
    timerInterval = null;
    $('#timerToggle').textContent = '继续学习';
    $('#timerToggle').className = 'timer-btn';
    saveTimer();
  } else if (timerState.status === 'paused') {
    timerState.status = 'running';
    timerState.sessionStart = Date.now();
    timerInterval = setInterval(updateTimerDisplay, 1000);
    $('#timerToggle').textContent = '暂停';
    $('#timerToggle').className = 'timer-btn primary';
  }
  saveTimer();
  if (connected) sendStatus();
}

function resetTimer() {
  if (timerState.status === 'running' && timerState.sessionStart) {
    const session = { start: new Date(timerState.sessionStart).toISOString(), end: new Date().toISOString() };
    timerSessions.push(session);
  }
  timerState = {status:'idle', accumulatedMs:0, sessionStart:null};
  clearInterval(timerInterval);
  timerInterval = null;
  updateTimerDisplay();
  saveTimer();
  if (connected) sendStatus();
}

// ---- Goals UI ----
function renderGoals() {
  const list = $('#goalList');
  if (goals.length === 0) {
    list.innerHTML = '';
    $('#goalsEmpty').style.display = '';
    return;
  }
  $('#goalsEmpty').style.display = 'none';
  list.innerHTML = goals.map((g,i) => `
    <li class="goal-item">
      <div class="goal-check ${g.done?'done':''}" data-idx="${i}"></div>
      <span class="goal-text ${g.done?'done':''}">${escapeHtml(g.text)}</span>
      <button class="goal-del" data-del="${i}">✕</button>
    </li>`).join('');
}

function escapeHtml(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

function addGoal() {
  const input = $('#goalInput');
  const text = input.value.trim();
  if (!text) return;
  goals.push({text, done:false});
  input.value = '';
  saveGoals();
  renderGoals();
  if (connected) sendStatus();
}

function saveGoals() {
  localStorage.setItem('sb_goals', JSON.stringify(goals));
}

function startSOS() {
  sosCount++;
  localStorage.setItem('sb_sos_today', String(sosCount));
  $('#sosCount').textContent = `今日已发送 ${sosCount} 次`;
  send({type:'sos', data:{count:sosCount}});
  $('#sosOverlay').classList.add('show');
  let sec = 120;
  const timer = setInterval(() => {
    sec--;
    const m = Math.floor(sec/60), s = sec%60;
    $('#sosTimer').textContent = `${m}:${String(s).padStart(2,'0')}`;
    if (sec <= 0) { clearInterval(timer); $('#sosOverlay').classList.remove('show'); }
  }, 1000);
}

function cancelSOS() {
  $('#sosOverlay').classList.remove('show');
}

function showEncourage(msg) {
  const t = $('#encourageToast');
  t.textContent = '💪 ' + msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ---- Supabase REST + Polling (no external JS!) ----
var REST = '';
var connected = false;
var myId = '';
var myRole = 'student';
var pollTimer = null;
var lastPollTs = 0;
var history = [];

function apiHeaders() {
  return {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json'
  };
}

function showError(msg) {
  const bar = $('#errorBar');
  bar.textContent = '⚠️ ' + msg;
  bar.classList.add('show');
}

function hideError() {
  $('#errorBar').classList.remove('show');
}

function generateId() {
  var stored = localStorage.getItem('sb_peer_id');
  if (!stored) {
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    stored = '';
    for (var i = 0; i < 6; i++) stored += chars[Math.floor(Math.random() * chars.length)];
    localStorage.setItem('sb_peer_id', stored);
  }
  return stored;
}

function initAndConnect() {
  if (!SUPABASE_URL || SUPABASE_URL === 'YOUR_SUPABASE_URL' || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY === 'YOUR_SUPABASE_ANON_KEY') {
    $('#connText').textContent = '⚠️ 请先在 config.js 填入 Supabase 配置';
    setStatus('offline');
    showError('config.js 中 SUPABASE_URL 或 SUPABASE_ANON_KEY 未填写');
    return;
  }

  REST = SUPABASE_URL.replace(/\/$/, '') + '/rest/v1';
  var params = new URLSearchParams(location.search);
  var roomParam = params.get('room');
  myId = roomParam ? roomParam.toUpperCase() : generateId();
  $('#roomCode').textContent = myId;

  connectSupabase();
}

function connectSupabase() {
  setStatus('connecting');
  $('#connText').textContent = '正在连接 Supabase…';
  $('#helpBar').style.display = 'none';
  hideError();

  fetch(REST + '/messages?room=eq.' + encodeURIComponent(myId) + '&limit=1', {
    headers: apiHeaders()
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + r.statusText);
    return r.json();
  }).then(function() {
    connected = true;
    setStatus('waiting');
    $('#connText').textContent = '已连接 · 等待监督者加入';
    $('#helpBar').style.display = 'none';
    sendStatus();
    sendHistory();
    startPolling();
  }).catch(function(err) {
    connected = false;
    setStatus('offline');
    $('#connText').textContent = '连接失败，3秒后重试…';
    $('#helpBar').style.display = '';
    showError('连接失败: ' + err.message);
    setTimeout(connectSupabase, 3000);
  });
}

function startPolling() {
  lastPollTs = Date.now();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(function() {
    if (!connected) return;
    fetch(REST + '/messages?room=eq.' + encodeURIComponent(myId) + '&timestamp=gt.' + lastPollTs + '&order=timestamp.asc', {
      headers: apiHeaders()
    }).then(function(r) { return r.json(); }).then(function(msgs) {
      msgs.forEach(function(msg) {
        if (msg.sender === myRole) return;
        handleIncoming(msg);
        lastPollTs = Math.max(lastPollTs, msg.timestamp || 0);
      });
    }).catch(function() {});
  }, 2000);
}

function send(msg) {
  if (!connected) return;
  fetch(REST + '/messages', {
    method: 'POST',
    headers: Object.assign({}, apiHeaders(), {'Prefer': 'return=minimal'}),
    body: JSON.stringify({
      room: myId,
      type: msg.type,
      data: msg.data || msg,
      sender: myRole,
      timestamp: Date.now()
    })
  }).catch(function(err) { console.error('Send error:', err); });
}

function setStatus(state) {
  var el = $('#connStatus');
  if (state === 'online') el.className = 'conn-status online';
  else if (state === 'connecting') el.className = 'conn-status connecting';
  else el.className = 'conn-status offline';
}

function handleIncoming(msg) {
  switch (msg.type) {
    case 'encourage':
      showEncourage((msg.data && msg.data.message) || msg.message || '加油！');
      break;
    case 'supervisor-online':
      setStatus('online');
      $('#connText').textContent = '✅ 监督者已在线';
      sendStatus();
      sendHistory();
      break;
  }
}

function sendStatus() {
  var ms = getCurrentMs();
  var sessionStartStr = timerState.sessionStart
    ? new Date(timerState.sessionStart).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'})
    : null;
  send({
    type: 'status',
    data: {
      goals: goals.map(function(g) { return {text:g.text, done:g.done}; }),
      completed: goals.filter(function(g) { return g.done; }).length,
      total: goals.length,
      sosCount: sosCount,
      timer: {
        status: timerState.status,
        currentMs: ms,
        accumulatedMs: timerState.accumulatedMs,
        sessionStart: timerState.sessionStart,
        sessionStartStr: sessionStartStr,
        sessions: timerSessions
      }
    }
  });
}

function sendHistory() {
  history.forEach(function(h) { send({type:'encourage', data:{message:h.message, fromHistory:true}}); });
}

// ---- Daily snapshot ----
function saveDailyRecord(dateStr) {
  if (!dateStr || !timerSessions || timerSessions.length === 0) return;
  const totalMs = timerSessions.reduce(function(sum, s) {
    if (s.end) return sum + (new Date(s.end) - new Date(s.start));
    return sum;
  }, 0);
  const record = {date:dateStr, totalMinutes:Math.round(totalMs/60000), sessions:timerSessions.length, goalsCompleted:goals.filter(function(g){return g.done;}).length, goalsTotal:goals.length, sosCount:sosCount};
  localStorage.setItem('sb_record_' + dateStr, JSON.stringify(record));
}

// ---- Init ----
renderGoals();
renderRecords();
updateTimerDisplay();
$('#sosCount').textContent = `今日已发送 ${sosCount} 次`;

$('#goalList').addEventListener('click', function(e) {
  var idx = e.target.getAttribute('data-idx');
  if (idx !== null) {
    goals[idx].done = !goals[idx].done;
    saveGoals(); renderGoals();
    if (connected) sendStatus();
  }
  var del = e.target.getAttribute('data-del');
  if (del !== null) {
    goals.splice(parseInt(del), 1);
    saveGoals(); renderGoals();
    if (connected) sendStatus();
  }
});

$('#addBtn').addEventListener('click', addGoal);
$('#goalInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') addGoal();
});

$('#sosBtn').addEventListener('click', startSOS);
$('#sosCancel').addEventListener('click', cancelSOS);
$('#sosOverlay').addEventListener('click', function(e) {
  if (e.target === $('#sosOverlay')) cancelSOS();
});

$('#timerToggle').addEventListener('click', toggleTimer);
$('#timerReset').addEventListener('click', function() {
  if (confirm('确定要重置计时器吗？')) resetTimer();
});

$('#roomCode').addEventListener('click', function() {
  navigator.clipboard.writeText(myId).then(function() {
    var el = $('#roomCode');
    var orig = el.textContent;
    el.textContent = '✅ 已复制';
    setTimeout(function() { el.textContent = orig; }, 1500);
  });
});

$('#retryLink').addEventListener('click', function(e) { e.preventDefault(); connectSupabase(); });

$('#recordsHeader').addEventListener('click', function() {
  var list = $('#recordsList');
  var tog = $('#recordsToggle');
  if (list.style.display === 'none') { list.style.display = ''; tog.textContent = '▾'; }
  else { list.style.display = 'none'; tog.textContent = '▸'; }
});

$('#historyHeader').addEventListener('click', function() {
  var list = $('#historyList');
  var tog = $('#historyToggle');
  if (list.style.display === 'none') { list.style.display = ''; tog.textContent = '▾'; }
  else { list.style.display = 'none'; tog.textContent = '▸'; }
});

document.addEventListener('visibilitychange', function() {
  if (!document.hidden && connected) sendStatus();
});

// Status sync every 10s
setInterval(function() { if (connected) sendStatus(); }, 10000);

// Start
initAndConnect();

window.addEventListener('beforeunload', function() {
  saveDailySnapshot();
  if (timerState.status === 'running' && timerState.sessionStart) {
    timerState.accumulatedMs += Date.now() - timerState.sessionStart;
    timerState.status = 'paused';
    timerState.sessionStart = null;
    saveTimer();
  }
});

function saveDailySnapshot() {
  if (timerSessions.length === 0 && timerState.accumulatedMs === 0) return;
  var totalMs = timerState.status === 'running' && timerState.sessionStart
    ? timerState.accumulatedMs + (Date.now() - timerState.sessionStart)
    : timerState.accumulatedMs;
  var snapshot = {
    date: today,
    totalMinutes: Math.round(totalMs / 60000),
    sessions: timerSessions,
    goals: goals,
    sosCount: sosCount
  };
  localStorage.setItem('sb_snapshot_' + today, JSON.stringify(snapshot));
}
})();
</script>
</body>
</html>
