<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研能量站 · 监督模式</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #f5f5f5;
  color: #333;
  min-height: 100vh;
}
/* ---- Room Section ---- */
.room-section {
  max-width: 400px;
  margin: 60px auto;
  padding: 40px 30px;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  text-align: center;
}
.room-section h2 { font-size: 22px; margin-bottom: 8px; }
.room-section p { font-size: 14px; color: #888; margin-bottom: 20px; }
#roomInput {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 18px;
  letter-spacing: 4px;
  text-align: center;
  margin-bottom: 12px;
}
#roomInput:focus { border-color: #7c4dff; outline: none; }
#joinBtn {
  width: 100%;
  padding: 12px;
  background: #7c4dff;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
#joinBtn:hover { background: #651fff; }
#connectingIndicator {
  display: none;
  margin-top: 12px;
  font-size: 14px;
  color: #7c4dff;
}
#connectingIndicator.show { display: block; }

/* ---- Dashboard ---- */
.dashboard { display: none; max-width: 900px; margin: 0 auto; padding: 20px; }
.header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.header-bar h2 { font-size: 20px; }
.conn-tag {
  font-size: 13px;
  padding: 4px 12px;
  border-radius: 20px;
  background: #eee;
  color: #888;
}
.conn-tag.online { background: #e8f5e9; color: #2e7d32; }

/* ---- Status cards ---- */
.status-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.status-card {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.08);
}
.status-card h4 { font-size: 13px; color: #888; margin-bottom: 8px; }
.status-card .value { font-size: 28px; font-weight: 700; color: #333; }
.status-card .sub { font-size: 12px; color: #aaa; margin-top: 4px; }

/* ---- Timer card ---- */
.timer-card {
  background: #fff;
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  margin-bottom: 24px;
  text-align: center;
}
.timer-card .time-display {
  font-size: 48px;
  font-weight: 700;
  color: #7c4dff;
  font-variant-numeric: tabular-nums;
}
.timer-card .time-label { font-size: 14px; color: #888; margin-top: 8px; }

/* ---- Goals card ---- */
.goals-card {
  background: #fff;
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  margin-bottom: 24px;
}
.goals-card h3 { font-size: 16px; margin-bottom: 16px; }
.goal-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #f0f0f0;
}
.goal-row:last-child { border-bottom: none; }
.goal-row .check { color: #ccc; font-size: 18px; }
.goal-row.done .check { color: #4caf50; }
.goal-row .text { flex: 1; font-size: 15px; }
.goal-row.done .text { text-decoration: line-through; color: #aaa; }

/* ---- Actions ---- */
.actions {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.actions button {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
#btnEncourage {
  background: #7c4dff;
  color: #fff;
}
#btnEncourage:hover { background: #651fff; }
#btnSosAlert {
  background: #ffebee;
  color: #d32f2f;
}
#btnSosAlert:hover { background: #ffcdd2; }

/* ---- Log ---- */
.log-section {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.08);
}
.log-section h3 { font-size: 16px; margin-bottom: 12px; }
#logList {
  max-height: 300px;
  overflow-y: auto;
  font-size: 13px;
  color: #666;
}
.log-item {
  padding: 6px 0;
  border-bottom: 1px solid #f5f5f5;
}
.log-item::before { content: '· '; color: #7c4dff; }
</style>
</head>
<body>

<!-- Room Input -->
<div class="room-section" id="roomSection">
  <h2>🔍 输入监督码</h2>
  <p>让学生把房间号发给你</p>
  <input type="text" id="roomInput" placeholder="6位房间号" maxlength="6">
  <button id="joinBtn">连接</button>
  <div id="connectingIndicator">正在连接…</div>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
  <div class="header-bar">
    <h2>📊 学习监督面板</h2>
    <div>
      <span class="conn-tag" id="studentTag">🔴 离线</span>
    </div>
  </div>

  <div class="status-grid">
    <div class="status-card">
      <h4>✅ 目标完成</h4>
      <div class="value" id="goalsCompleted">0 / 0</div>
      <div class="sub">今日目标</div>
    </div>
    <div class="status-card">
      <h4>🆘 求助次数</h4>
      <div class="value" id="sosTotal">0</div>
      <div class="sub">累计求助</div>
    </div>
  </div>

  <div class="timer-card">
    <div class="time-display" id="timerDisplay">00:00</div>
    <div class="time-label" id="timerLabel">未开始学习</div>
  </div>

  <div class="goals-card">
    <h3>📋 今日目标</h3>
    <div id="goalsList"><p style="color:#ccc;">暂无目标</p></div>
  </div>

  <div class="actions">
    <button id="btnEncourage">💪 发送鼓励</button>
    <button id="btnSosAlert">🆘 求助提醒</button>
  </div>

  <div class="log-section">
    <h3>📝 连接日志</h3>
    <div id="logList"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
// ========== Pure REST API helpers ==========
var API_URL = SUPABASE_URL + '/rest/v1/';
var HEADERS = {
  'Accept': 'application/json',
  'Content-Type': 'application/json',
  'apikey': SUPABASE_ANON_KEY,
  'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
  'Prefer': 'return=representation'
};

function api(path, method, body) {
  var url = API_URL + path;
  var opts = {
    method: method,
    headers: HEADERS
  };
  if (body) opts.body = JSON.stringify(body);
  return fetch(url, opts).then(function(r) {
    if (!r.ok) {
      return r.text().then(function(text) {
        var hint = '';
        if (r.status === 401) hint = ' (API key 无效)';
        if (r.status === 403) hint = ' (权限不足：请在 Supabase SQL Editor 执行 GRANT SELECT, INSERT ON public.messages TO anon;)';
        if (text && text.indexOf('permission denied') !== -1) hint = ' (权限不足：请给 anon 角色授权)';
        throw new Error('HTTP ' + r.status + hint + (text ? ': ' + text.substring(0, 120) : ''));
      });
    }
    if (r.status === 204) return {};
    return r.json();
  });
}

// ========== State ==========
var room = '';
var myRole = 'supervisor';
var connected = false;
var lastStatus = null;
var pollTimer = null;
var processedIds = {};  // 用对象代替 Set，兼容性更好

// ========== Init ==========
function initAndConnect() {
  if (!SUPABASE_URL || SUPABASE_URL === 'YOUR_SUPABASE_URL') {
    addLog('⚠️ 请先在 config.js 填入 Supabase 配置');
    return;
  }

  room = document.getElementById('roomInput').value.trim().toUpperCase();
  if (!room || room.length < 3) {
    document.getElementById('roomInput').placeholder = '请输入6位监督码';
    return;
  }

  document.getElementById('roomInput').disabled = true;
  document.getElementById('joinBtn').disabled = true;
  document.getElementById('connectingIndicator').classList.add('show');

  // Test connection
  api('messages?select=id&room=eq.' + encodeURIComponent(room) + '&limit=1', 'GET')
    .then(function() {
      connected = true;
      document.getElementById('connectingIndicator').classList.remove('show');
      document.getElementById('roomSection').style.display = 'none';
      document.getElementById('dashboard').style.display = '';
      document.getElementById('studentTag').textContent = '🟢 在线';
      document.getElementById('studentTag').className = 'conn-tag online';
      addLog('✅ 已连接！等待学生的数据同步…');
      send({ type: 'supervisor-online' });
      startPolling();
    })
    .catch(function(err) {
      console.error('Supabase error:', err);
      connected = false;
      document.getElementById('connectingIndicator').classList.remove('show');
      var msg = err.message || '';
      if (msg.indexOf('403') !== -1 || msg.indexOf('permission denied') !== -1 || msg.indexOf('权限') !== -1) {
        addLog('❌ 数据库权限不足：请在 Supabase SQL Editor 执行 GRANT SELECT, INSERT ON public.messages TO anon;');
      } else if (msg.indexOf('404') !== -1) {
        addLog('❌ messages 表不存在');
      } else {
        addLog('🔴 连接失败: ' + msg + '，3秒后重试…');
      }
      document.getElementById('roomInput').disabled = false;
      document.getElementById('joinBtn').disabled = false;
      setTimeout(initAndConnect, 3000);
    });
}

// ========== Polling ==========
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  // 首次连接时拉取最近30条消息（含历史），之后每次拉取全部该房间消息去重处理
  api('messages?select=*&room=eq.' + encodeURIComponent(room) + '&sender=neq.supervisor&order=id.asc&limit=30', 'GET')
    .then(function(msgs) {
      msgs.forEach(function(msg) {
        processedIds[msg.id] = true;
        handleIncoming(msg);
      });
      addLog('✅ 已同步 ' + msgs.length + ' 条历史消息');
    })
    .catch(function(err) { addLog('⚠️ 首次同步失败: ' + (err.message || err)); });

  pollTimer = setInterval(function() {
    if (!connected) return;
    api('messages?select=*&room=eq.' + encodeURIComponent(room) + '&sender=neq.supervisor&order=id.asc', 'GET')
      .then(function(msgs) {
        msgs.forEach(function(msg) {
          if (processedIds[msg.id]) return; // 已处理过，跳过
          processedIds[msg.id] = true;
          handleIncoming(msg);
        });
      })
      .catch(function(err) {
        console.error('Poll error:', err);
        addLog('⚠️ 轮询错误: ' + (err.message || err));
      });
  }, 2000);
}

// ========== Send ==========
function send(msg) {
  if (!connected) return;
  api('messages', 'POST', {
    room: room,
    type: msg.type,
    data: msg.data || msg,
    sender: myRole,
    timestamp: Date.now()
  }).catch(function(err) {
    console.error('Send error:', err);
  });
}

// ========== Handle incoming ==========
function handleIncoming(msg) {
  switch (msg.type) {
    case 'status':
    case 'history':
      lastStatus = msg.data || msg;
      updateDashboard(lastStatus);
      break;
    case 'sos':
      addLog('🆘 学生发送了求助！');
      break;
  }
}

// ========== Dashboard ==========
function updateDashboard(data) {
  // Goals
  if (data.goals) {
    var completed = data.goals.filter(function(g) { return g.done; }).length;
    document.getElementById('goalsCompleted').textContent = completed + ' / ' + data.goals.length;

    var list = document.getElementById('goalsList');
    if (data.goals.length === 0) {
      list.innerHTML = '<p style="color:#ccc;">暂无目标</p>';
    } else {
      list.innerHTML = data.goals.map(function(g) {
        return '<div class="goal-row' + (g.done ? ' done' : '') + '">' +
          '<span class="check">' + (g.done ? '✅' : '☐') + '</span>' +
          '<span class="text">' + escapeHtml(g.text) + '</span>' +
          '</div>';
      }).join('');
    }
  }

  // SOS
  if (data.sosCount !== undefined) {
    document.getElementById('sosTotal').textContent = data.sosCount;
  }

  // Timer
  if (data.timer) {
    var t = data.timer;
    var ms = t.status === 'running' ? (t.accumulatedMs || 0) + (Date.now() - t.sessionStart) : (t.accumulatedMs || 0);
    var totalSec = Math.floor(ms / 1000);
    var hrs = Math.floor(totalSec / 3600);
    var mins = Math.floor((totalSec % 3600) / 60);
    var secs = totalSec % 60;
    var display = '';
    if (hrs > 0) display += hrs + ':';
    display += String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    document.getElementById('timerDisplay').textContent = display;

    var label = '';
    if (t.status === 'running') label = '正在学习中…';
    else if (t.status === 'paused') label = '已暂停';
    else label = '未开始';
    document.getElementById('timerLabel').textContent = label;
  }
}

// ========== Actions ==========
document.getElementById('joinBtn').addEventListener('click', initAndConnect);
document.getElementById('roomInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') initAndConnect();
});

document.getElementById('btnEncourage').addEventListener('click', function() {
  var messages = [
    '加油！你可以的！💪',
    '专注当下，未来可期！✨',
    '每一次努力都在积累成功！🌟',
    '相信自己，你比想象中更强大！🚀'
  ];
  var msg = messages[Math.floor(Math.random() * messages.length)];
  send({ type: 'encourage', data: { message: msg } });
  addLog('💪 已发送鼓励：' + msg);
});

document.getElementById('btnSosAlert').addEventListener('click', function() {
  send({ type: 'sos-alert', message: '老师提醒：请确认是否需要帮助？' });
  addLog('🆘 已发送求助提醒');
});

// ========== Log ==========
function addLog(text) {
  var list = document.getElementById('logList');
  var div = document.createElement('div');
  div.className = 'log-item';
  div.textContent = new Date().toLocaleTimeString('zh-CN') + ' ' + text;
  list.insertBefore(div, list.firstChild);
}

// ========== Utility ==========
function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
</script>
</body>
</html>
